<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title><%= enroll_title %></title>

    <script type="module" src="./js/iDIN-enroll.js"></script>
</head>
<body>

<div class="container">
    <div class="row">
        <div id="logo" class="col-12 col-md-8 col-lg-6 offset-md-2 offset-lg-3">
            <hr/>
            <a href="#">
                <img class="logo-img" src="images/iDIN_logo_64.png" />
            </a>
        </div>
        <div class="col-12 col-md-8 col-lg-6 offset-md-2 offset-lg-3" id="enroll-page" style="display: none;">
            <h2><%= enroll_header %></h2>

            <div id="alert_box"></div>

            <p><%= enroll_received_attributes %></p>
            <table class="table" id="idinTable">
                <tbody></tbody>
            </table>
            <br/>
            <p><%= enroll_derived_attributes %></p>
            <table class="table" id="ageTable">
                <tbody></tbody>
            </table>

            <p id="twoCredentialsWarning" style="display: none"><i><%= enroll_two_credentials_warning %></i></p>

            <p><%= enroll_clicktoload %></p>
            <button id="enroll" class="btn btn-primary"><%= enroll_load_button %></button>
            <hr />
        </div>
    </div>
</div>
</body>
</html>
