image: node:20

stages:
  - build

before_script:
  - set -euxo pipefail
  - corepack enable
  - yarn install --immutable

build-en:
  stage: build
  script:
    - yarn build:en
  artifacts:
    # Disabling artifact expiry is not supported yet, so make
    expire_in: 100 year
    paths:
      - build/*

build-nl:
  stage: build
  script:
    - yarn build:nl
  artifacts:
    # Disabling artifact expiry is not supported yet, so make
    expire_in: 100 year
    paths:
      - build/*
