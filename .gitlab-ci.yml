image: node:20

stages:
  - build

before_script:
  - set -euxo pipefail
  - corepack enable
  # The repo ships a Yarn v1 lockfile and no `packageManager` field in
  # package.json, so corepack hands us Yarn classic, which silently ignores
  # `--immutable`. Use the v1-equivalent flag so CI actually enforces the lock.
  - yarn install --frozen-lockfile

build-en:
  stage: build
  script:
    - yarn build:en
  artifacts:
    # Disabling artifact expiry is not supported yet, so make
    expire_in: 100 year
    paths:
      - build/*

build-nl:
  stage: build
  script:
    - yarn build:nl
  artifacts:
    # Disabling artifact expiry is not supported yet, so make
    expire_in: 100 year
    paths:
      - build/*
